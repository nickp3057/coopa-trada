{% extends "base.html" %}
{% block title %} &middot; Activity{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Activity</h1>
    <p class="hint">What the bot is watching right now, and everything it has done.</p>
  </div>
</div>

<section class="card">
  <div class="card-head">
    <h2>Watching now</h2>
    <span class="row-tight"><span class="hint" id="watch-updated"></span>
      <span class="tip" data-tip="Every open position, its latest price, its high, and the price at which each rule would sell it. The highlighted stop is the one that would fire first. Refreshes every 10 seconds."></span></span>
  </div>
  <div id="watch" class="pick-cards"><p class="empty">loading&hellip;</p></div>
</section>

<section class="card">
  <div class="card-head">
    <h2>Everything that happened</h2>
    <span class="row-tight">
      <span class="tip" data-tip="Every line the bot writes, kept for a year: runs, picks, every buy and sell decision with its reason, orders, fills, skips, alerts, settings changes (old → new), and every button pressed on these pages."></span>
      <a id="act-download" class="btn btn-small" href="#" data-tip="Save this day's full log as a text file">Download this day</a>
    </span>
  </div>
  <div class="row">
    <label class="inline">Day <select id="act-day"></select></label>
    <label class="inline">Show
      <select id="act-level">
        <option value="">everything</option>
        <option value="WARNING">warnings and errors</option>
        <option value="ERROR">errors only</option>
      </select></label>
    <label class="inline">Search <input id="act-q" type="text" placeholder="e.g. IBIT, EXIT, settings" size="22"></label>
    <label class="inline" data-tip="Add new lines as they happen (today only)"><input id="act-live" type="checkbox" checked> follow live</label>
  </div>
  <p id="act-count" class="summary"></p>
  <div id="act-lines" class="event-feed tall"></div>
</section>
{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='watch.js') }}"></script><script src="{{ url_for('static', filename='activity.js') }}"></script>{% endblock %}
